name: LARD Controller
version: "0.1.14"
slug: lard_controller
description: >
  Supervises the LARD board-priority Braiins actuator. Observe-and-publish
  always; miner writes stay off until enable_writes and the HA master gate
  are both on. Braiins OS owns cooling: cooling_control_enabled defaults
  false, so this add-on does not PUT /api/v1/cooling/mode. Hashboard pause,
  resume, power target, and board priority stay. Never reboots the miner.
  Never touches SRNE, BMS, or grid. Never turns on
  switch.solar_miner_auto_enable.
url: https://github.com/reliableroofing2020/ha-lard-controller
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
host_network: true
hassio_api: true
homeassistant_api: true
hassio_role: default
stage: stable
timeout: 60
watchdog: http://[HOST]:[PORT:8099]/health
webui: http://[HOST]:[PORT:8099]/
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Controller health and status (no Braiins writes)
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false
    path: /share
  - type: ssl
    read_only: true
    path: /ssl
services:
  - mqtt:want
backup_exclude:
  - "*.log"
  - "status.json"
options:
  miner_url: "http://192.168.1.113"
  poll_seconds: 10
  board_wait_seconds: 60
  ha_base_url: ""
  enable_writes: false
  power_target_w: 944
  braiins_username: "root"
  braiins_password: ""
  ha_token: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  timezone: "America/Chicago"
  cooling_dwell_seconds: 600
  cooling_stabilize_seconds: 5
  cooling_resume_settle_seconds: 20
  cooling_one_board_max_fan_pct: 70
  cooling_two_board_max_fan_pct: 85
  cooling_three_board_max_fan_pct: 100
  cooling_paused_max_fan_pct: 100
  cooling_one_board_min_fan_pct: 0
  cooling_two_board_min_fan_pct: 0
  cooling_three_board_min_fan_pct: 0
  cooling_paused_min_fan_pct: 0
  cooling_writes_only_when_paused: true
  auto_fan_ceiling_enabled: false
  # Braiins OS owns cooling. Leave false. native_auto_target and
  # legacy_fan_ceiling do not PUT, pause-for-cooling, or open the fan
  # envelope on thermal abort unless this is explicitly true.
  cooling_control_enabled: false
  cooling_policy: native_auto_target
  # Internal Celsius fallbacks when no HA helper state exists.
  # Operator helpers are Fahrenheit. Do not store °F in these keys.
  # A stored 70 must stay 70 °C, not be reread as 70 °F.
  cooling_target_temperature_c: 70
  cooling_hot_temperature_c: 85
  cooling_dangerous_temperature_c: 95
  cooling_envelope_min_fan_pct: 0
  cooling_envelope_max_fan_pct: 100
  cooling_settle_seconds: 45
  transition_poll_interval_seconds: 10
  expected_recovery_seconds: 240
  maximum_recovery_seconds: 600
  post_retry_recovery_seconds: 180
  stable_hash_poll_count: 3
  telemetry_failures_before_error: 3
  resume_retry_enabled: true
  max_resume_retries_per_transaction: 1
  coalesce_pending_cooling_requests: true
schema:
  miner_url: str
  poll_seconds: int(5,300)
  board_wait_seconds: int(30,300)
  ha_base_url: str?
  enable_writes: bool
  power_target_w: int(100,5000)
  braiins_username: str
  braiins_password: password
  ha_token: password
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password
  timezone: str
  cooling_dwell_seconds: int(0,86400)
  cooling_stabilize_seconds: int(0,120)
  cooling_resume_settle_seconds: int(0,600)
  cooling_one_board_max_fan_pct: int(0,100)
  cooling_two_board_max_fan_pct: int(0,100)
  cooling_three_board_max_fan_pct: int(0,100)
  cooling_paused_max_fan_pct: int(0,100)
  cooling_one_board_min_fan_pct: int(0,100)
  cooling_two_board_min_fan_pct: int(0,100)
  cooling_three_board_min_fan_pct: int(0,100)
  cooling_paused_min_fan_pct: int(0,100)
  cooling_writes_only_when_paused: bool
  auto_fan_ceiling_enabled: bool
  cooling_control_enabled: bool
  cooling_policy: list(native_auto_target|legacy_fan_ceiling)
  cooling_target_temperature_c: int(0,200)
  cooling_hot_temperature_c: int(0,200)
  cooling_dangerous_temperature_c: int(0,200)
  cooling_envelope_min_fan_pct: int(0,100)
  cooling_envelope_max_fan_pct: int(0,100)
  cooling_settle_seconds: int(0,3600)
  transition_poll_interval_seconds: int(1,120)
  expected_recovery_seconds: int(0,7200)
  maximum_recovery_seconds: int(0,7200)
  post_retry_recovery_seconds: int(0,7200)
  stable_hash_poll_count: int(1,20)
  telemetry_failures_before_error: int(1,20)
  resume_retry_enabled: bool
  max_resume_retries_per_transaction: int(0,1)
  coalesce_pending_cooling_requests: bool
environment:
  LARD_HEALTH_PORT: "8099"

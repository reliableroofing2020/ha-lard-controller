configuration:
  miner_url:
    name: Miner URL
    description: Braiins OS+ REST base (no trailing slash required). Default is the S19j Pro on the LAN.
  poll_seconds:
    name: Poll interval (seconds)
    description: Main control loop period. Health is 200 while the last loop is newer than 2× this value.
  board_wait_seconds:
    name: Board wait (seconds)
    description: How long to poll GET hashboards after a PATCH 200 (accepted, not applied). Minimum enforced wait is 60s. Skipped entirely when topology already matches (PAUSED and ONE_BOARD share board 1). Resume confirmation is a separate 120s window.
  ha_base_url:
    name: Home Assistant URL
    description: Leave empty to use the Supervisor proxy (http://supervisor/core). Set a URL only for local/dev.
  enable_writes:
    name: Enable Braiins writes
    description: Leave false until recovery tests pass. Board/pause/resume/power/cooling writes also require input_boolean.lard_board_priority_enable to be on. Cooling is maintenance-gated (pause-first) and never written live while hashing.
  power_target_w:
    name: Power target (W)
    description: Braiins floor used for all non-paused modes. v1 stays at 944 W.
  braiins_username:
    name: Braiins username
    description: Usually root. Password is not stored in git — use this option, /data/secrets.json, or BRAIINS_PASSWORD.
  braiins_password:
    name: Braiins password
    description: Miner login password. Prefer this secret field or /data/secrets.json. Never commit it.
  ha_token:
    name: Long-lived HA token
    description: Only for local/dev. As an add-on, SUPERVISOR_TOKEN is used automatically.
  mqtt_host:
    name: MQTT broker host
    description: Optional. Empty tries Supervisor Mosquitto discovery (mqtt:want), then falls back to HA REST entity writes.
  mqtt_port:
    name: MQTT port
    description: Broker port when mqtt_host is set.
  mqtt_username:
    name: MQTT username
    description: Optional broker user.
  mqtt_password:
    name: MQTT password
    description: Optional broker password.
  timezone:
    name: Timezone
    description: Used only for human log timestamps. Heartbeat last_seen is UTC ISO-8601.
  cooling_dwell_seconds:
    name: Cooling dwell (seconds)
    description: Minimum time between cooling-profile transitions so short solar/SOC or slider flaps do not thrash fans. Thermal abort bypasses dwell. Default 600.
  cooling_stabilize_seconds:
    name: Cooling stabilize (seconds)
    description: Short pause after a confirmed cooling PUT before the resume-settle window. Default 5.
  cooling_resume_settle_seconds:
    name: Cooling resume settle (seconds)
    description: Legacy settle used only when cooling_settle_seconds is 0. 0.1.7 recovery does not escalate ResumeMining 500s to Start or BOSminer Restart.
  cooling_one_board_max_fan_pct:
    name: ONE_BOARD max fan % (TBD/measured)
    description: Placeholder auto max_fan_speed for ONE_BOARD. Replace with a measured-safe value. Capped by input_number.lard_fan_max_pct.
  cooling_two_board_max_fan_pct:
    name: TWO_BOARD max fan % (TBD/measured)
    description: Placeholder auto max_fan_speed for TWO_BOARD. Replace with a measured-safe value. Capped by input_number.lard_fan_max_pct.
  cooling_three_board_max_fan_pct:
    name: THREE_BOARD max fan % (TBD/measured)
    description: Placeholder auto max_fan_speed for THREE_BOARD (full/normal envelope). Replace with a measured-safe value.
  cooling_paused_max_fan_pct:
    name: PAUSED max fan % (TBD/measured)
    description: Optional unconstrained / known-good restore envelope while paused. Placeholder 100.
  cooling_one_board_min_fan_pct:
    name: ONE_BOARD min fan % (TBD/measured)
    description: Optional min_fan_speed for ONE_BOARD. 0 omits the field. Placeholder.
  cooling_two_board_min_fan_pct:
    name: TWO_BOARD min fan % (TBD/measured)
    description: Optional min_fan_speed for TWO_BOARD. 0 omits the field. Placeholder.
  cooling_three_board_min_fan_pct:
    name: THREE_BOARD min fan % (TBD/measured)
    description: Optional min_fan_speed for THREE_BOARD. 0 omits the field. Placeholder.
  cooling_paused_min_fan_pct:
    name: PAUSED min fan % (TBD/measured)
    description: Optional min_fan_speed while paused. 0 omits the field. Placeholder.
  cooling_writes_only_when_paused:
    name: Cooling writes only when paused
    description: When true (default), a cooling PUT is refused unless the miner is paused and idle. Never a live mid-hash PUT.
  auto_fan_ceiling_enabled:
    name: Auto fan ceiling
    description: Leave false. Automatic fan-ceiling changes stay off until a proof run. Explicit maintenance transitions still use the gated pause path.
  cooling_settle_seconds:
    name: Cooling settle (seconds)
    description: Poll after a confirmed cooling PUT before ResumeMining. Default 45. Do not resume just because the PUT returned.
  transition_poll_interval_seconds:
    name: Transition poll interval (seconds)
    description: How often to poll pause, settle, and recovery. Default 10.
  expected_recovery_seconds:
    name: Expected recovery (seconds)
    description: 0 W is normal through this window when Braiins is in cooldown, preheat, startup, or APPLYING. Default 240.
  maximum_recovery_seconds:
    name: Maximum recovery (seconds)
    description: Keep waiting past the expected window only while lifecycle stays positive. Default 600. Then one resume retry.
  post_retry_recovery_seconds:
    name: Post-retry recovery (seconds)
    description: Shorter window after the single automatic resume retry. Default 180. Then DEGRADED_NEEDS_ATTENTION, not ERROR.
  stable_hash_poll_count:
    name: Stable hash polls
    description: Consecutive good watts/hashrate/board samples required before health is HASHING. Default 3.
  telemetry_failures_before_error:
    name: Telemetry failures before ERROR
    description: First misses are UNKNOWN or STALE and do not pause, resume, or write cooling. Default 3.
  resume_retry_enabled:
    name: Resume retry
    description: Allow one automatic ResumeMining retry after maximum recovery. Default true.
  max_resume_retries_per_transaction:
    name: Max resume retries per transaction
    description: Hard cap is 1. Default 1.
  coalesce_pending_cooling_requests:
    name: Coalesce pending cooling
    description: While a transaction is active, keep only the newest requested fan ceiling and apply it after HASHING or a terminal state. Default true.
network:
  8099/tcp: Health and status HTTP (no miner writes)

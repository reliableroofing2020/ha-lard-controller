# LARD Controller — envelope cap helper (not a live fan writer)
#
# 0.1.5+: this helper only caps the *desired* cooling profile
# (min(mode_profile_max, this value)). The add-on never PUTs
# /api/v1/cooling/mode while hashing. Cooling changes go through
# the gated pause → PUT → resume owner.
#
# Install (pick one):
#   1. Copy this file to config/packages/lard_fan_max.yaml and enable
#      packages in configuration.yaml, then restart Core.
#   2. Settings → Devices & services → Helpers → Create → Number:
#        entity_id: input_number.lard_fan_max_pct
#        min 0, max 100, step 1, initial 100
#
# The add-on cannot create a real YAML/UI helper via REST. If this entity
# is missing it defaults the envelope cap to 100 and may POST a state stub.
#
# Do not add a separate HA automation that writes Braiins fans.
# Keep automation.solar_miner_fan_watchdog off.

input_number:
  lard_fan_max_pct:
    name: LARD Fan Max % (envelope cap)
    min: 0
    max: 100
    step: 1
    initial: 100
    mode: box
    unit_of_measurement: "%"
    icon: mdi:fan

# LARD Controller — legacy fan-ceiling cap (not a live fan writer)
#
# 0.1.11: cooling_control_enabled defaults false. This helper is ignored.
# It is not deleted. LARD does not PUT cooling unless that option is true.
#
# 0.1.9 default policy is native_auto_target. This helper is NOT the
# control knob in that mode and does not schedule cooling PUTs.
# It only caps per-board max_fan_speed when cooling_policy is
# legacy_fan_ceiling AND auto_fan_ceiling_enabled is true (default false).
#
# 0.1.5+: even on the legacy path the add-on never PUTs
# /api/v1/cooling/mode while hashing. Cooling changes go through
# the gated pause → PUT → resume owner.
#
# Install (pick one):
#   1. Copy this file to config/packages/lard_fan_max.yaml and enable
#      packages in configuration.yaml, then restart Core.
#   2. Settings → Devices & services → Helpers → Create → Number:
#        entity_id: input_number.lard_fan_max_pct
#        min 0, max 100, step 1, initial 100
#
# The add-on cannot create a real YAML/UI helper via REST. If this entity
# is missing it defaults the envelope cap to 100 and may POST a state stub.
#
# Do not add a separate HA automation that writes Braiins fans.
# Keep automation.solar_miner_fan_watchdog off.

input_number:
  lard_fan_max_pct:
    name: LARD Fan Max % (envelope cap)
    min: 0
    max: 100
    step: 1
    initial: 100
    mode: box
    unit_of_measurement: "%"
    icon: mdi:fan
